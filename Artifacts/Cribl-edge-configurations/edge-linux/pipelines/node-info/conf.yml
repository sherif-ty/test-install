output: default
streamtags: []
groups: {}
asyncFuncTimeout: 1000
functions:
- id: eval
  filter: "true"
  disabled: null
  conf:
    add:
    - disabled: false
      name: SubFleetName
      value: __metadata.cribl.group
    - disabled: false
      name: Connection_IP
      value: __metadata.os.interfaces.net1[0].address
    - disabled: false
      value: __metadata.cribl.version
      name: version
    - disabled: false
      name: OS_type
      value: "'linux'"
    - disabled: false
      value: __metadata.os.cpu_count
      name: total_CPU
    - disabled: false
      value: __metadata.os.memory
      name: total_memory
    - disabled: false
      value: __metadata.env.userdomain
      name: domain
    - disabled: false
      name: hostname
      value: host
    remove:
    - _host
description: ""
